# Tema do Geno: floresta à noite (paleta da Mariana). O resto do visual está no CSS de app/geno/tema.py.
[theme]
base = "dark"
primaryColor = "#E8613C"             # coral: botões, rádios, barra de progresso
backgroundColor = "#0F3D33"          # verde-noite: fundo da página
secondaryBackgroundColor = "#164E41" # verde um tom acima: tabelas, menus, campos
textColor = "#FAF3E7"                # creme: texto
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap, Georgia, serif"

[client]
toolbarMode = "minimal"              # esconde o botão "Deploy" do Streamlit

[server]
headless = true

[browser]
gatherUsageStats = false
